name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: 代码检查与测试
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent123
          POSTGRES_DB: agent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://agent:agent123@127.0.0.1:5432/agent_db
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: sk-ci-dummy-key
      LLM_MODEL: gpt-4o-mini
      JWT_SECRET: ci-test-secret-not-for-prod

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - name: 安装依赖
        run: uv sync --frozen

      - name: Ruff 静态检查
        run: uv run ruff check .

      - name: Ruff 格式检查
        run: uv run ruff format --check .

      - name: Mypy 类型检查
        run: uv run mypy app

      - name: Pytest 自动化测试
        run: uv run pytest -q