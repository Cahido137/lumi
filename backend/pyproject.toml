[project]
name = "lumi-backend"
version = "0.1.0"
description = "Lumi个人助理Agent后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "bcrypt",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.uv]
package = false